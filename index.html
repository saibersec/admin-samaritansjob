<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - SAMARITAN'S JOB</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0b0f1e; color: #f1f5f9; padding: 20px; display: flex; justify-content: center; }
    .admin-card { background: #151c33; border: 1px solid #1e293b; border-radius: 12px; padding: 24px; width: 100%; max-width: 550px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h2 { font-size: 20px; margin-bottom: 20px; color: #38bdf8; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    
    .section { margin-bottom: 20px; }
    label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 8px; font-weight: 700; letter-spacing: 0.5px; }
    
    /* Job Status Cards */
    .job-status-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .job-row { display: flex; align-items: center; justify-content: space-between; background: #0b0f1e; padding: 12px 16px; border-radius: 8px; border: 1px solid #1e293b; }
    .job-title { font-weight: bold; font-size: 14px; color: #e2e8f0; }
    
    .status-box { display: flex; gap: 8px; }
    .btn-status { padding: 8px 14px; border: none; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: all 0.2s; opacity: 0.3; }
    .btn-status.active-open { background: #22c55e; color: white; opacity: 1; box-shadow: 0 0 10px rgba(34, 197, 94, 0.4); }
    .btn-status.active-close { background: #ef4444; color: white; opacity: 1; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }

    /* Rule List UI */
    .rule-item { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .input-num { width: 65px; background: #0b0f1e; border: 1px solid #334155; color: #38bdf8; padding: 10px; border-radius: 6px; text-align: center; font-weight: bold; }
    .input-text { flex: 1; background: #0b0f1e; border: 1px solid #334155; color: white; padding: 10px; border-radius: 6px; }
    .btn-del { background: #ef4444; color: white; border: none; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    
    .btn-add { background: #334155; color: #38bdf8; border: 1px dashed #38bdf8; width: 100%; padding: 10px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    .btn-save { background: #38bdf8; color: #0b0f1e; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
    .btn-save:hover { background: #0284c7; color: white; }
  </style>
</head>
<body>

<div class="admin-card">
  <h2>⚙️ Panel Admin SAMARITAN'S JOB</h2>

  <!-- Status Job Per Kategori -->
  <div class="section">
    <label>STATUS INDIVIDUAL JOB:</label>
    <div class="job-status-group">
      
      <!-- Job Gmail -->
      <div class="job-row">
        <span class="job-title">✉️ JOB GMAIL</span>
        <div class="status-box">
          <button id="btn-gmail-OPEN" class="btn-status" onclick="setJobStatus('gmail', 'OPEN')">🟢 OPEN</button>
          <button id="btn-gmail-CLOSED" class="btn-status" onclick="setJobStatus('gmail', 'CLOSED')">🔴 CLOSED</button>
        </div>
      </div>

      <!-- Job File -->
      <div class="job-row">
        <span class="job-title">📁 JOB FILE</span>
        <div class="status-box">
          <button id="btn-file-OPEN" class="btn-status" onclick="setJobStatus('file', 'OPEN')">🟢 OPEN</button>
          <button id="btn-file-CLOSED" class="btn-status" onclick="setJobStatus('file', 'CLOSED')">🔴 CLOSED</button>
        </div>
      </div>

      <!-- Job Chat -->
      <div class="job-row">
        <span class="job-title">💬 JOB CHAT</span>
        <div class="status-box">
          <button id="btn-chat-OPEN" class="btn-status" onclick="setJobStatus('chat', 'OPEN')">🟢 OPEN</button>
          <button id="btn-chat-CLOSED" class="btn-status" onclick="setJobStatus('chat', 'CLOSED')">🔴 CLOSED</button>
        </div>
      </div>

    </div>
  </div>

  <hr style="border-color: #1e293b; margin-bottom: 20px;">

  <!-- Edit Rules List -->
  <div class="section">
    <label>DAFTAR RULES & KETENTUAN:</label>
    <div id="rulesContainer">
      <!-- Item Rule akan terisi otomatis secara visual -->
    </div>
    <button class="btn-add" onclick="addRuleRow()">+ Tambah Rule Baru</button>
  </div>

  <button class="btn-save" onclick="saveAllData()">💾 SIMPAN PERUBAHAN</button>
</div>

<script>
  const BIN_ID = "6ab6ec1cac6210605af5c413";
  const API_KEY = "$2a$10$O7in8/v51RhnZVFCIuKo9ezWGLgrZ6XAcx6nTrGVa66ADZUp570wm";

  // Penampung Objek Status Per Job
  let currentStatus = {
    gmail: "OPEN",
    file: "OPEN",
    chat: "OPEN"
  };

  // 1. Ambil Data Awal dari JSONBin
  async function loadAdminData() {
    try {
      let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": API_KEY }
      });
      let data = await res.json();
      let record = data.record;

      // Update Tampilan Status Per Job
      if (record.status) {
        if (typeof record.status === 'object') {
          currentStatus = { ...currentStatus, ...record.status };
        } else {
          // Fallback jika data lama masih berupa string tunggal
          currentStatus = { gmail: record.status, file: record.status, chat: record.status };
        }
      }

      renderStatusButtons();

      // Render Rules ke Form UI
      const container = document.getElementById("rulesContainer");
      container.innerHTML = "";
      if (record.rules && record.rules.length > 0) {
        record.rules.forEach(rule => {
          addRuleRow(rule.num, rule.text);
        });
      }
    } catch (err) {
      alert("Gagal memuat data dari JSONBin!");
    }
  }

  // 2. Mengubah Nilai Status Salah Satu Job
  function setJobStatus(job, status) {
    currentStatus[job] = status;
    renderStatusButtons();
  }

  // Render Warna/State Tombol Status Berdasarkan Objek currentStatus
  function renderStatusButtons() {
    ['gmail', 'file', 'chat'].forEach(job => {
      const openBtn = document.getElementById(`btn-${job}-OPEN`);
      const closeBtn = document.getElementById(`btn-${job}-CLOSED`);
      const val = currentStatus[job] || "OPEN";

      if (val === "OPEN") {
        openBtn.className = "btn-status active-open";
        closeBtn.className = "btn-status";
      } else {
        openBtn.className = "btn-status";
        closeBtn.className = "btn-status active-close";
      }
    });
  }

  // 3. Tambah Baris Form Rule Baru
  function addRuleRow(num = "", text = "") {
    const container = document.getElementById("rulesContainer");
    const div = document.createElement("div");
    div.className = "rule-item";
    div.innerHTML = `
      <input type="text" class="input-num" value="${num}" placeholder="01 / ex">
      <input type="text" class="input-text" value="${text}" placeholder="Isi aturan di sini...">
      <button class="btn-del" onclick="this.parentElement.remove()">✕</button>
    `;
    container.appendChild(div);
  }

  // 4. Simpan Seluruh Perubahan ke JSONBin
  async function saveAllData() {
    const ruleItems = document.querySelectorAll(".rule-item");
    let updatedRules = [];

    ruleItems.forEach(item => {
      let num = item.querySelector(".input-num").value;
      let text = item.querySelector(".input-text").value;
      if (text.trim() !== "") {
        updatedRules.push({ num: num || "•", text: text });
      }
    });

    try {
      let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "X-Master-Key": API_KEY
        },
        body: JSON.stringify({
          status: currentStatus,
          rules: updatedRules
        })
      });

      if (res.ok) {
        alert("✅ Berhasil disimpan! Status & Rules tiap job diperbarui.");
      } else {
        alert("❌ Gagal menyimpan.");
      }
    } catch (err) {
      alert("Koneksi gagal.");
    }
  }

  loadAdminData();
</script>

</body>
</html>
